<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0e1525;
  --fg:#e0ddf0;
  --dim:#6a7a90;
  --ora:#e8622c;
  --lime:#7ec440;
  --lime-h:#92d850;
  --font:-apple-system,"Helvetica Neue","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
html{
  height:100dvh;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:clamp(1.5rem,4vw,3rem);
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='600'%3E%3Cdefs%3E%3Cg id='o' opacity='.06'%3E%3Ccircle r='1' fill='%23f59a2c'/%3E%3Ccircle r='.83' fill='%23fbb040'/%3E%3Cline x1='0' y1='-.83' x2='0' y2='.83' stroke='white' stroke-width='.06'/%3E%3Cline x1='0' y1='-.83' x2='0' y2='.83' stroke='white' stroke-width='.06' transform='rotate(36)'/%3E%3Cline x1='0' y1='-.83' x2='0' y2='.83' stroke='white' stroke-width='.06' transform='rotate(72)'/%3E%3Cline x1='0' y1='-.83' x2='0' y2='.83' stroke='white' stroke-width='.06' transform='rotate(108)'/%3E%3Cline x1='0' y1='-.83' x2='0' y2='.83' stroke='white' stroke-width='.06' transform='rotate(144)'/%3E%3Ccircle r='.1' fill='white'/%3E%3C/g%3E%3C/defs%3E%3Cuse href='%23o' transform='translate(95,45) scale(48) rotate(8)'/%3E%3Cuse href='%23o' transform='translate(390,95) scale(42) rotate(-12)'/%3E%3Cuse href='%23o' transform='translate(540,240) scale(52) rotate(25)'/%3E%3Cuse href='%23o' transform='translate(240,180) scale(38) rotate(-5)'/%3E%3Cuse href='%23o' transform='translate(460,410) scale(46) rotate(18)'/%3E%3Cuse href='%23o' transform='translate(140,350) scale(44) rotate(-20)'/%3E%3Cuse href='%23o' transform='translate(320,480) scale(50) rotate(10)'/%3E%3Cuse href='%23o' transform='translate(570,530) scale(40) rotate(-15)'/%3E%3Cuse href='%23o' transform='translate(-30,530) scale(40) rotate(-15)'/%3E%3Cuse href='%23o' transform='translate(590,150) scale(45) rotate(30)'/%3E%3Cuse href='%23o' transform='translate(-10,150) scale(45) rotate(30)'/%3E%3Cuse href='%23o' transform='translate(180,580) scale(43) rotate(-8)'/%3E%3Cuse href='%23o' transform='translate(180,-20) scale(43) rotate(-8)'/%3E%3C/svg%3E");
  background-size:600px 600px;
  pointer-events:none;
}
body::after{
  content:"";
  position:fixed;
  width:60vmax;
  height:60vmax;
  border-radius:50%;
  background:radial-gradient(circle,rgba(232,98,44,.045) 0%,transparent 60%);
  top:-15%;
  right:-18%;
  pointer-events:none;
  animation:drift 30s ease-in-out infinite;
}
main{
  max-width:52rem;
  width:100%;
  position:relative;
  z-index:1;
}
.hero{
  font-size:clamp(3rem,8.5vw,8.5rem);
  font-weight:800;
  line-height:.88;
  letter-spacing:-.045em;
  text-transform:uppercase;
  background:linear-gradient(
    120deg,
    var(--fg) 0%,
    var(--fg) 40%,
    #f0e8e0 48%,
    #f2ebe2 52%,
    var(--fg) 60%,
    var(--fg) 100%
  );
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shimmer 10s linear infinite,fadeUp .8s ease both;
}
.content{
  display:grid;
  gap:clamp(.35rem,1vw,.8rem);
}
.ln{
  font-size:clamp(1rem,2.2vw,1.6rem);
  font-weight:400;
  line-height:1.45;
  letter-spacing:-.01em;
  color:var(--dim);
}
.ln:nth-child(1){animation:fadeUp .8s ease .15s both}
.ln:nth-child(2){animation:fadeUp .8s ease .25s both}
.ln:nth-child(3){animation:fadeUp .8s ease .35s both}
.ln strong{
  color:var(--ora);
  font-weight:600;
}
.sig{
  margin-top:clamp(.5rem,1.2vw,1.2rem);
  font-size:clamp(1rem,2.2vw,1.6rem);
  font-weight:400;
  line-height:1.45;
  animation:fadeUp .8s ease .45s both;
}
.sig .name{font-weight:700}
.cta-wrap{margin-top:clamp(.2rem,.6vw,.4rem)}
.cta{
  display:inline-flex;
  align-items:baseline;
  gap:.25em;
  font:600 clamp(1.05rem,2.3vw,1.65rem) var(--mono);
  color:var(--lime);
  text-decoration:none;
  letter-spacing:.02em;
  transition:color .25s,text-shadow .35s;
}
.cta:hover{
  color:var(--lime-h);
  text-shadow:0 0 20px rgba(126,196,64,.3),0 0 40px rgba(126,196,64,.1);
}
.cta:focus-visible{
  outline:2px solid var(--lime);
  outline-offset:4px;
  border-radius:2px;
}
.cta .ar{
  display:inline-block;
  transition:transform .25s ease;
}
.cta:hover .ar{transform:translateX(4px)}

@keyframes shimmer{
  from{background-position:100% 0}
  to{background-position:0% 0}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-4%,6%) scale(1.04)}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

@media(max-width:900px){
  .hero{font-size:clamp(2.8rem,8vw,5rem)}
  .ln,.sig{font-size:clamp(1rem,2.6vw,1.3rem)}
  .cta{font-size:clamp(1rem,2.6vw,1.3rem)}
}

@media(max-width:600px){
  body{padding:clamp(1.2rem,5vw,1.8rem)}
  .hero{font-size:clamp(2.8rem,15vw,4rem)}
  .content{gap:clamp(.3rem,2vw,.6rem)}
  .ln{font-size:clamp(1rem,4.5vw,1.2rem)}
  .sig{
    font-size:clamp(1rem,4.5vw,1.2rem);
    margin-top:clamp(.8rem,4vw,1.2rem);
    padding-top:clamp(.8rem,4vw,1.2rem);
    border-top:1px solid rgba(224,221,240,.06);
  }
  .cta{font-size:clamp(1.05rem,4.8vw,1.25rem)}
}

@media(max-width:380px){
  body{padding:1rem}
  .hero{font-size:clamp(2.4rem,14vw,3.2rem)}
  .ln,.sig{font-size:clamp(.95rem,4.2vw,1.1rem)}
  .cta{font-size:clamp(1rem,4.5vw,1.15rem)}
}

@media(max-height:440px) and (orientation:landscape){
  body{padding:.5rem 2rem}
  .hero{font-size:clamp(1.8rem,8vh,3rem)}
  .content{gap:.1rem}
  .ln,.sig{font-size:clamp(.7rem,2.6vh,.95rem)}
  .sig{margin-top:.2rem;padding-top:0;border-top:none}
  .cta{font-size:clamp(.7rem,2.6vh,.95rem)}
  .cta-wrap{margin-top:.1rem}
}

@media(min-width:1200px) and (min-height:900px){
  .hero{font-size:clamp(6rem,7.5vw,8.5rem)}
  .ln,.sig{font-size:clamp(1.3rem,1.6vw,1.85rem)}
  .cta{font-size:clamp(1.3rem,1.6vw,1.85rem)}
}
</style>

  <div class="content">

    <p class="ln">but when you <strong>build it right the first time</strong>, there is no second time, and no more horror stories to speak of.</p>
    <div class="sig">
      <p>Hi, I'm <span class="name">Chuck Reynolds</span>,</p>
      <p>and I build it right the first time.</p>
      <div class="cta-wrap">
        <a class="cta" href="https://chuckreynolds.com?utm_source=builditrightthefirsttime&amp;utm_medium=website&amp;utm_campaign=talktochuck" title="contact chuck reynolds" rel="me"><span class="ar" aria-hidden="true">🍊</span> Talk to Chuck</a>
      </div>
    </div>
  </div>
</main>
